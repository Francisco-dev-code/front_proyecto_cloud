<h1>Streaming (Kafka)</h1>

  Dos tópicos de negocio con 3 particiones y 3 réplicas. Los eventos se publican con el DTO
  <code>EventoMensajeria</code> y los consumidores alimentan notificaciones y auditoría.
</p>

  </mat-tab>
  <mat-tab label="Publicar evento">
    <ng-template matTabContent><app-publicar-panel /></ng-template>
  </mat-tab>
  <mat-tab label="Métricas en vivo">

  </mat-tab>
